<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1424" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="Jessica Frieden – Digital Solutions & ICT Specialist mit Fokus auf Application Management und User Experience. Enterprise IT, Healthcare IT, IAM und Cybersecurity." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Jessica Frieden – Digital Solutions & ICT Specialist</title>
    <script>
      // Theme vor dem ersten Paint setzen (verhindert Flackern).
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
